# oc-mirror v2 ImageSetConfiguration — open-source Cilium 1.20.5 + cilium-cli v0.20.3 test images
# Target: OpenShift 4.22.20 UPI (9 VMs) + bare metal added later with `oc adm node-image create`
#
# Image list taken from the 1.20.5 Helm chart values.yaml and cilium-cli v0.20.3 defaults.
# The OpenShift 4.22.20 release payload is NOT in this file — you mirror it as usual
# (node-image create only needs images from that payload).
#
#   connected:     oc mirror -c imageset-cilium-1.20.5.yaml file://cilium-mirror --v2
#   disconnected:  oc mirror -c imageset-cilium-1.20.5.yaml --from file://cilium-mirror docker://<REGISTRY> --v2
#
# Images land at <REGISTRY>/cilium/..., <REGISTRY>/frrouting/frr, etc. (upstream path kept).
# The values file points every chart image at <REGISTRY>, so no ITMS/IDMS is needed for Cilium.
# The digests in the comments are the ones pinned by the chart/CLI. Check them with: skopeo inspect --raw | sha256sum
